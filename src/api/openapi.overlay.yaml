overlay: 1.1.0
info:
  title: Frontend API contract adjustments
  version: 1.0.0
actions:
  - target: $.components.schemas.Item
    description: 실제 뉴스 응답에 항상 포함되는 항목 필드. 요약·언론사명은 필수 키지만 null일 수 있다.
    update:
      required:
        [
          documentId,
          title,
          summary,
          source,
          publisherName,
          publishedAt,
          timestampBasis,
          url,
          linkKind,
        ]
  - target: $.components.schemas.StockNewsResponse
    description: 뉴스 응답의 조회 조건·건수·목록을 필수로 지정한다.
    update:
      required: [stockId, country, window, fetchedAt, windowCovered, total, items]
  - target: $.components.schemas.StockNewsResponse.properties.items
    description: 종목 뉴스는 최대 20건이며 빈 목록도 반환한다.
    update:
      minItems: 0
      maxItems: 20
  - target: $.components.schemas.StockDisclosureResponse
    description: 공시 응답의 조회 조건·수집 상태·건수·목록을 필수로 지정한다.
    update:
      required:
        [
          stockId,
          country,
          source,
          window,
          windowPrecision,
          filedDateRange,
          fetchedAt,
          coverage,
          total,
          items,
        ]
  - target: $.components.schemas.StockDisclosureResponse.properties.filedDateRange
    description: 객체 참조에 type null이 함께 선언된 서버 스키마를 nullable 객체로 보정한다.
    remove: true
  - target: $.components.schemas.StockDisclosureResponse.properties
    update:
      filedDateRange:
        description: 공급자 접수일 조회 범위. 공급자를 조회하지 않으면 null이다.
        anyOf:
          - $ref: "#/components/schemas/FiledDateRange"
          - type: "null"
  - target: $.components.schemas.StockDisclosureResponse.properties.items
    description: 최대 100건. 뉴스 Item과 충돌한 참조를 실제 공시 응답으로 확인한 별도 타입에 연결한다.
    update:
      minItems: 0
      maxItems: 100
      items:
        $ref: "#/components/schemas/StockDisclosureItem"
  - target: $.components.schemas
    description: 2026-10-04 실제 KR(9001)·US(9037) 공시 응답으로 확인한 항목. 서버 Item 참조 충돌이 해소되면 제거한다.
    update:
      StockDisclosureItem:
        type: object
        required:
          [
            provider,
            providerDocumentId,
            type,
            title,
            formType,
            formLabel,
            issuerName,
            filerName,
            remark,
            filedDate,
            publishedAt,
            datePrecision,
            timeBasis,
            summary,
            summaryStatus,
            url,
            linkKind,
          ]
        properties:
          provider: { type: string, enum: [DART, SEC] }
          providerDocumentId: { type: string }
          type: { type: string, enum: [DISCLOSURE] }
          title: { type: string }
          formType: { type: [string, "null"] }
          formLabel: { type: [string, "null"] }
          issuerName: { type: string }
          filerName: { type: [string, "null"] }
          remark: { type: [string, "null"] }
          filedDate: { type: string, format: date }
          publishedAt: { type: [string, "null"], format: date-time }
          datePrecision: { type: string }
          timeBasis: { type: string }
          summary:
            type: [string, "null"]
            description: 현재 요약은 제공하지 않으며 summaryStatus=UNAVAILABLE일 때 null이다.
          summaryStatus: { type: string, enum: [UNAVAILABLE] }
          url: { type: string, format: uri }
          linkKind: { type: string }
  - target: $.components.schemas.Candle
    description: Match required Candle fields to the stock chart API contract.
    update:
      required: [tradeAt, open, high, low, close, volume, closed]
  - target: $.components.schemas.StockChartResponse
    description: The stock chart API always returns candles, including an empty array when no data is available.
    update:
      required: [candles]
  - target: $.components.schemas.IndustryTrendResponse.properties.stocks
    description: 서버 명세의 시가총액 상위 0~4개 조건을 반영한다.
    update:
      minItems: 0
      maxItems: 4
  - target: $.components.schemas.IndustryFlowResponse.properties.majorStocks
    description: 서버 명세의 시가총액 상위 0~2개 조건을 반영한다.
    update:
      minItems: 0
      maxItems: 2
  - target: $.components.schemas.IndustryNewsResponse.properties.news
    description: 서버 명세의 가장 최근 관련 뉴스 0~1건 조건을 반영한다.
    update:
      minItems: 0
      maxItems: 1
  - target: "$..properties.calculatedAt"
    description: 산업 API 문서의 계산 이력 없음(null)을 반영한다.
    update:
      type: [string, "null"]
  - target: $.components.schemas.ErrorResponse
    description: 오류 응답의 error를 필수로 지정한다.
    update:
      required: [error]
  - target: $.components.schemas.ErrorDetail
    description: 런타임 오류 파서와 일치하도록 오류 이름·코드·메시지를 필수로 지정한다.
    update:
      required: [name, message]
  - target: $.components.schemas.FieldError
    description: 필드 오류가 제공되면 오류 대상 필드를 필수로 지정한다.
    update:
      required: [field]
  - target: $.paths
    description: 화면 구현에 필요한 목록 조회 계약. 백엔드 구현 확인 전까지 frontend-proposed로 구분한다.
    update:
      /api/v1/stocks:
        get:
          x-contract-source: frontend-proposed
          operationId: readStocks
          summary: 종목 검색 및 주요 변동 종목 조회
          description: 국가·산업·검색어로 필터링한 종목을 반환한다. UP은 양의 등락률 내림차순, DOWN은 음의 등락률 오름차순, VOLUME은 volumeRatio20d 내림차순, ALL은 등락률 내림차순이다. includeCaution이 false면 투자 유의 종목을 제외한다. page는 1부터 시작한다.
          parameters:
            - { name: country, in: query, required: true, schema: { type: string, enum: [KR, US] } }
            - { name: q, in: query, schema: { type: string } }
            - { name: industry, in: query, schema: { type: string } }
            - {
                name: sort,
                in: query,
                schema: { type: string, enum: [ALL, UP, DOWN, VOLUME], default: UP },
              }
            - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
            - {
                name: size,
                in: query,
                schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
              }
            - { name: includeCaution, in: query, schema: { type: boolean, default: false } }
          responses:
            "200":
              description: 성공
              content:
                application/json:
                  schema: { $ref: "#/components/schemas/ApiResultStockListResponse" }
  - target: $.components.schemas
    description: 현재 종목 시세·산업 흐름 스키마를 기반으로 목록에 필요한 필드만 제안한다.
    update:
      StockListItem:
        x-contract-source: frontend-proposed
        allOf:
          - $ref: "#/components/schemas/StockQuoteResponse"
          - type: object
            required:
              [
                stockId,
                ticker,
                name,
                currency,
                price,
                changeRate,
                indicators,
                industryCode,
                industryName,
                caution,
                contextSummary,
              ]
            properties:
              industryCode: { type: string, example: AUTOMOBILE }
              industryName: { type: string, example: 자동차 }
              caution: { type: boolean, example: false }
              contextSummary:
                type: [string, "null"]
                description: 확인된 관련 맥락. 없으면 null이며 가격 변동의 원인으로 단정하지 않는다.
                example: null
      StockListResponse:
        type: object
        required: [items, page, size, total]
        properties:
          items: { type: array, items: { $ref: "#/components/schemas/StockListItem" } }
          page: { type: integer, minimum: 1, example: 1 }
          size: { type: integer, minimum: 1, example: 20 }
          total: { type: integer, minimum: 0, example: 40 }
      ApiResultStockListResponse:
        type: object
        properties:
          data: { $ref: "#/components/schemas/StockListResponse" }
  - target: "$..[?(@.properties.data && !(@.required[?(@ == 'data')]))]"
    description: data 속성이 있는 모든 스키마에서 data를 필수로 지정한다.
    update:
      required:
        - data
  - target: $.components.schemas.MarketChartResponse.properties.candles
    description: 시장 지표 차트 응답에는 거래량이 없으므로 종목 차트 Candle과 분리한다.
    update:
      items:
        $ref: "#/components/schemas/MarketChartCandle"
  - target: $.components.schemas
    description: 백엔드 MarketChartResponse.Candle과 실제 응답에 맞춘 지표 차트 한 점.
    update:
      MarketChartCandle:
        type: object
        required: [tradeAt, open, high, low, close, closed]
        properties:
          tradeAt: { type: string, format: date }
          open: { type: number }
          high: { type: number }
          low: { type: number }
          close: { type: number }
          closed: { type: boolean }
