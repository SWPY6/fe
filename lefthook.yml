pre-commit:
  jobs:
    - name: format
      glob: '*.{css,html,js,jsx,json,jsonc,md,mjs,ts,tsx,yaml,yml}'
      run: pnpm exec oxfmt --write --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: lint
      glob: '*.{js,jsx,mjs,ts,tsx}'
      run: pnpm exec oxlint --fix --deny-warnings --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: pnpm typecheck
    - name: test
      run: pnpm test:run
